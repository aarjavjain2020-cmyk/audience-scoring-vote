<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f8">
  <title>Audience scoring</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8f8;color:#1d2c34;font:16px/1.5 Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.shell{max-width:880px;padding:0 22px 70px;margin:auto}.topline{height:78px;border-bottom:1px solid #d8e0e3;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;font-size:18px;letter-spacing:-.02em}.lang{border:0;background:none;color:#315b76;font-size:14px;font-weight:600;padding:8px}.tabs{display:flex;gap:24px;border-bottom:1px solid #d8e0e3;margin-top:30px}.tab{border:0;background:none;border-bottom:2px solid transparent;color:#63727a;padding:0 1px 13px;font-size:15px;font-weight:600}.tab[aria-selected="true"]{color:#264e64;border-color:#264e64}.panel{background:#fff;border:1px solid #d8e0e3;border-radius:8px;margin-top:22px;padding:30px;min-height:320px}.eyebrow{color:#60717b;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:700;margin:0}h1{font-size:35px;line-height:1.16;letter-spacing:-.035em;margin:8px 0 8px}h2{font-size:21px;letter-spacing:-.025em;margin:0}.performer{font-size:22px;font-weight:600;margin:0 0 32px;word-break:break-word}.question{font-size:17px;margin:0 0 16px}.score-form{display:flex;align-items:end;gap:12px;max-width:350px}.field{display:flex;flex-direction:column;gap:7px;flex:1}.field label{font-size:14px;font-weight:600}.field input{height:48px;width:100%;padding:0 12px;border:1px solid #9eafb8;border-radius:5px;background:#fff}.primary{height:48px;padding:0 20px;border:0;border-radius:5px;background:#264e64;color:#fff;font-weight:600}.status{margin:20px 0 0;color:#466777;font-size:15px}.error{color:#a23c3c}.results-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.results-head span{color:#63727a;font-size:13px}.chart-scroll{overflow-x:auto;margin-top:18px}.chart-scroll svg{display:block}.chart-detail{display:block;min-height:27px;color:#42545d;font-size:14px;margin:8px 0 0}.empty{color:#64747d;font-size:15px;margin:24px 0}.hidden{display:none!important}button:focus-visible,input:focus-visible,rect:focus-visible{outline:3px solid #91b8c6;outline-offset:3px}@media(max-width:600px){.shell{padding:0 16px 50px}.panel{padding:23px}.topline{height:70px}h1{font-size:30px}.performer{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
  <link rel="stylesheet" href="./results.css"><script src="./results.js"></script><script src="./config.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topline"><span class="brand" data-i18n="brand">Audience scoring</span><button id="language" class="lang" type="button">हिन्दी</button></header>
    <nav class="tabs" aria-label="Sections"><button id="vote-tab" class="tab" aria-selected="true" type="button" data-i18n="voteTab">Vote</button><button id="results-tab" class="tab" aria-selected="false" type="button" data-i18n="resultsTab">Results</button></nav>
    <section id="vote-panel" class="panel" aria-labelledby="vote-tab"><p class="eyebrow" data-i18n="nowVoting">Now voting</p><p id="competition-day" class="subtle"></p><h1 id="song-number">Loading…</h1><p id="performer" class="performer"></p><p id="contestant-label" class="contestant-label"></p><p id="question" class="question hidden" data-i18n="question">How many points out of 20?</p><form id="score-form" class="score-form hidden"><div class="field"><label for="score" data-i18n="score">Score</label><input id="score" type="number" min="0" max="20" step="1" inputmode="numeric" required></div><button id="submit" class="primary" type="submit" data-i18n="submit">Submit</button></form><p id="vote-status" class="status" role="status" aria-live="polite"></p></section>
    <section id="results-panel" class="panel hidden" aria-labelledby="results-tab"><div class="results-head"><h2 data-i18n="resultsTab">Results</h2><span id="result-count"></span></div><div id="results-view"></div></section>
  </main>
  <script>
    const copy={en:{brand:'Audience scoring',voteTab:'Vote',resultsTab:'Results',nowVoting:'Now voting',question:'How many points out of 20?',score:'Score',submit:'Submit',empty:'Results appear here after voting closes.',song:'Song',waiting:'Waiting for the next performer.',submitted:'Answer submitted. Thank you.',already:'This device has already voted for this song.',closed:'Voting has closed. Check the results.',unavailable:'The poll is temporarily unavailable. Please try again.',points:'points',votes:'votes',total:'Average points (out of 20)'},hi:{brand:'दर्शक अंक',voteTab:'मत दें',resultsTab:'नतीजे',nowVoting:'अभी मतदान',question:'20 में से कितने अंक देंगे?',score:'अंक',submit:'जमा करें',empty:'मतदान बंद होने पर नतीजे यहाँ दिखेंगे।',song:'गीत',waiting:'अगले कलाकार का इंतज़ार है।',submitted:'जवाब जमा हो गया। धन्यवाद।',already:'इस डिवाइस से इस गीत पर पहले ही मत दिया जा चुका है।',closed:'मतदान बंद हो गया है। नतीजे देखें।',unavailable:'मतदान अभी उपलब्ध नहीं है। फिर कोशिश करें।',points:'अंक',votes:'मत',total:'औसत अंक (20 में से)'}};
    const $=(id)=>document.getElementById(id);let language=localStorage.getItem('poll-language')==='hi'?'hi':'en';let current=null;let resultsKey='';let activeTab='vote';let sending=false;
    const base=String(window.POLL_API_BASE||'').replace(/\/$/,'');
    function setText(id,value){$(id).textContent=value}
    function translate(){document.documentElement.lang=language;document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=copy[language][node.dataset.i18n]);$('language').textContent=language==='en'?'हिन्दी':'English';renderVote();if(current)renderResults(current.results)}
    function switchTab(tab){activeTab=tab;for(const name of ['vote','results']){$(name+'-tab').setAttribute('aria-selected',String(name===tab));$(name+'-panel').classList.toggle('hidden',name!==tab)}}
    function deviceId(){let id=localStorage.getItem('poll-device-id');if(!id){id=crypto.randomUUID();localStorage.setItem('poll-device-id',id)}return id}
    function hasVoted(songId){return localStorage.getItem('poll-voted-'+songId)==='1'}
    function renderVote(){const t=copy[language],song=current?.open;setText('competition-day',current?(language==='hi'?'दिन ':'Day ')+current.competition.day+(current.competition.day===5?(language==='hi'?' · फ़ाइनल':' · Final'):(language==='hi'?' · ऑडिशन':' · Auditions')):'');setText('contestant-label',song?PollResults.id(song.contestantId):'');$('score-form').classList.toggle('hidden',!song||hasVoted(song.id));$('question').classList.toggle('hidden',!song||hasVoted(song.id));if(song){setText('song-number',t.song+' '+song.number);setText('performer',song.performer);if(hasVoted(song.id))setText('vote-status',t.submitted);else if(!$('vote-status').classList.contains('error'))setText('vote-status','')}else{setText('song-number',t.waiting);setText('performer','');setText('vote-status','')}}
    async function refresh(){try{const response=await fetch(base+'/api/public/state',{cache:'no-store'});if(!response.ok)throw new Error();const previous=current?.open?.id;current=await response.json();if(previous!==current.open?.id){$('vote-status').classList.remove('error');$('score').value=''}renderVote();renderResults(current.results)}catch{if(!current){setText('song-number',copy[language].unavailable);setText('performer','');$('score-form').classList.add('hidden')}}}
    const resultsView=PollResults.create($('results-view'));
    function renderResults(){if(current){setText('result-count',String(current.results.length));resultsView.render(current,language);}}
    $('language').addEventListener('click',()=>{language=language==='en'?'hi':'en';localStorage.setItem('poll-language',language);translate()});$('vote-tab').addEventListener('click',()=>switchTab('vote'));$('results-tab').addEventListener('click',()=>switchTab('results'));
    $('score-form').addEventListener('submit',async(event)=>{event.preventDefault();if(!current?.open||sending)return;const score=Number($('score').value);if(!Number.isInteger(score)||score<0||score>20)return;const songId=current.open.id;sending=true;$('submit').disabled=true;$('vote-status').classList.remove('error');try{const response=await fetch(base+'/api/public/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songId,score,deviceId:deviceId()})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Failed');localStorage.setItem('poll-voted-'+songId,'1');setText('vote-status',copy[language].submitted);$('score-form').classList.add('hidden');$('question').classList.add('hidden')}catch(error){const message=String(error.message);setText('vote-status',message.includes('already voted')?copy[language].already:message.includes('closed')?copy[language].closed:copy[language].unavailable);$('vote-status').classList.add('error');await refresh()}finally{sending=false;$('submit').disabled=false}});
    translate();refresh();setInterval(refresh,10000);
  </script>
</body>
</html>
